# K3s default does not create a public Traefik dashboard Ingress.
# This file is an example of a secure dashboard Ingress (TLS + example settings).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traefik-dashboard
  namespace: kube-system
  annotations:
    # Use the TLS entrypoint; add authentication middleware when enabling.
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  tls:
    - hosts:
      - k3s-control.tail101cbe.ts.net
      secretName: traefik-dashboard-tls
  rules:
    - host: k3s-control.tail101cbe.ts.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: traefik
                port:
                  number: 80
